[pytest]
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --html=reports/report.html --self-contained-html
markers =
    positive: successful-flow tests (valid responses & correct data values)
    negative: error-handling tests (invalid key, missing/invalid parameters)
    schema: JSON schema-validation tests (response structure is consistent)
    performance: response-time threshold tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
